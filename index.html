<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selfbrain</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      .grainy-bg {
        background-image: url('data:image/svg+xml;charset=UTF-8,<svg xmlns="http://www.w3.org/2000/svg" width="4" height="4" viewBox="0 0 4 4"><path fill="%23222" fill-opacity="0.1" d="M0 0h1v1H0zM2 2h1v1H2z"></path></svg>');
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #030303;
      }
      ::-webkit-scrollbar-thumb {
        background: #222;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #333;
      }
      .fade-in-up {
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 0.6s ease-out, transform 0.6s ease-out;
      }
      .fade-in-up.is-visible {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              'brand-background': '#030303',
              'brand-text': '#EAEAEA',
              'brand-text-secondary': '#A0A0A0',
              'brand-border': 'rgba(255, 255, 255, 0.1)',
              'brand-purple': '#6a0dad',
              'brand-blue': '#0077b6',
              'brand-cyan': '#00b4d8',
            },
          }
        }
      }
    </script>
<script type="importmap">

  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-brand-background text-brand-text antialiased grainy-bg">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
