<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selfbrain</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #010103; /* A bit darker background */
        color: #EAEAEA;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior-y: none;
      }
      .fade-in-up {
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 0.6s ease-out, transform 0.6s ease-out;
      }
      .fade-in-up.is-visible {
        opacity: 1;
        transform: translateY(0);
      }
      .animate-letter-in {
        display: inline-block;
        opacity: 0;
        transform: translateY(20px) scale(0.95);
        animation: letter-in 0.5s cubic-bezier(0.215, 0.610, 0.355, 1.000) forwards;
      }
      @keyframes letter-in {
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              'brand-background': '#010103',
              'brand-text': '#EAEAEA',
              'brand-text-secondary': '#A0A0A0',
              'brand-border': 'rgba(255, 255, 255, 0.08)',
              'brand-purple': '#8A2BE2',
              'brand-blue': '#0096FF',
              'brand-cyan': '#00FFFF',
              'brand-magenta': '#FF00FF',
            },
            animation: {
              'aurora': 'aurora 50s linear infinite alternate',
              'aurora-2': 'aurora-2 45s linear infinite alternate-reverse',
              'grid-pan': 'grid-pan 120s linear infinite',
            },
            keyframes: {
              aurora: {
                '0%': { transform: 'translate(var(--x-start), var(--y-start)) scale(var(--scale-start))', opacity: 0.5 },
                '100%': { transform: 'translate(var(--x-end), var(--y-end)) scale(var(--scale-end))', opacity: 0.1 },
              },
               'aurora-2': {
                '0%': { transform: 'translate(var(--x-start), var(--y-start)) scale(var(--scale-start))', opacity: 0.4 },
                '100%': { transform: 'translate(var(--x-end), var(--y-end)) scale(var(--scale-end))', opacity: 0.15 },
              },
              'grid-pan': {
                '0%': { backgroundPosition: '0% 0%' },
                '100%': { backgroundPosition: '100% 100%' },
              }
            }
          }
        }
      }
    </script>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.1.0/",
    "react": "https://esm.sh/react@^19.1.0",
    "react-dom/": "https://esm.sh/react-dom@^19.1.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-brand-background text-brand-text">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
